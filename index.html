    <h2>ПОВЕРНИ ТЕЛЕФОН</h2>
    <p>Игра сделана для горизонтального экрана — так сцена крупнее, а кнопки не мешают.</p>
    <p id="rotate-ios" class="ios-tip" hidden>На iPhone панели Safari убираются так: <b>Поделиться → «На экран Домой»</b>. Игра появится иконкой и откроется на весь экран.</p>
    <button id="rotate-go">ИГРАТЬ НА ВЕСЬ ЭКРАН</button>
    <button id="rotate-skip" class="skip">играть вертикально</button>
  </div>

      <button class="pause-btn" data-key="pause" aria-label="Пауза">II</button>
      <div class="touch-actions">

        <button class="act-super" data-key="super">ПАНЧ</button>

        <button class="act-heavy" data-key="heavy">НОГА</button>
        <button class="act-special" data-key="special">СПЕЦ</button>
